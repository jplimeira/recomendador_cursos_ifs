services:
  recomendador-cursos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recomendador-cursos-ifs
    ports:
      - "8000:8000"
    environment:
      COURSES_JSON: /app/data/cursos_ifs.json
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      LOG_LEVEL: INFO
      MAX_CONCURRENT_INFERENCES: "2"
      ENABLE_ANONYMOUS_METRICS: "false"
      MANAGEMENT_DB: /app/runtime/management.sqlite3
      GESTAO_USER: ${GESTAO_USER:-gestao}
      GESTAO_PASSWORD: ${GESTAO_PASSWORD:?Defina GESTAO_PASSWORD no arquivo .env}
      # Para habilitar contadores anônimos persistentes, monte um volume em /app/runtime.
      # METRICS_DB: /app/runtime/metrics.sqlite3
    volumes:
      - modelo_huggingface:/models
      - dados_gestao:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  modelo_huggingface:
  dados_gestao:
