services:
  recomendador-cursos:
    build: ./recomendador_cursos_ifs
    environment:
      COURSES_JSON: /app/data/cursos_ifs.json
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      HF_HOME: /models/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - modelo_huggingface:/models
    restart: unless-stopped
  interface:
    build: ./guia_carreira_ifs
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      IFS_IA_API_URL: http://recomendador-cursos:8000
    volumes:
      - ./guia_carreira_ifs/database:/app/database
    depends_on:
      - recomendador-cursos
    restart: unless-stopped
volumes:
  modelo_huggingface:
