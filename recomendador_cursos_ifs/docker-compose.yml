services:
  recomendador-cursos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recomendador-cursos-ifs
    ports:
      - "8000:8000"
    environment:
      COURSES_JSON: /app/data/cursos_ifs.json
      EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      LOG_LEVEL: INFO
    volumes:
      - modelo_huggingface:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  modelo_huggingface:
